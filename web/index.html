<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-Hermes</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Mini-Hermes</p>
        <h1>Chat trực tiếp và nhóm</h1>
      </div>
      <button id="logout-button" class="secondary" type="button" hidden>Đăng xuất</button>
    </header>

    <p id="notice" class="notice" role="status" hidden></p>
    <p id="error" class="error" role="alert" hidden></p>

    <section id="auth-view" class="auth-grid">
      <form id="register-form" class="card">
        <h2>Đăng ký</h2>
        <label for="register-username">Username</label>
        <input id="register-username" name="username" autocomplete="username" required>

        <label for="register-password">Mật khẩu</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required>

        <button type="submit">Tạo tài khoản</button>
      </form>

      <form id="login-form" class="card">
        <h2>Đăng nhập</h2>
        <label for="login-username">Username</label>
        <input id="login-username" name="username" autocomplete="username" required>

        <label for="login-password">Mật khẩu</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Đăng nhập</button>
      </form>
    </section>

    <section id="chat-view" class="chat-layout" hidden>
      <aside class="card sidebar">
        <div class="session">
          <span>Đang đăng nhập</span>
          <strong id="current-username"></strong>
        </div>
        <section class="conversation-section" aria-labelledby="direct-heading">
          <h2 id="direct-heading">Chat 1-1</h2>
          <div id="direct-thread-list" class="peer-list"></div>
          <div id="new-direct-section">
            <h3>Mở chat mới</h3>
            <div id="peer-list" class="peer-list"></div>
          </div>
        </section>
        <section class="conversation-section" aria-labelledby="group-heading">
          <h2 id="group-heading">Chat nhóm</h2>
          <div id="group-thread-list" class="peer-list"></div>
          <form id="group-form">
            <h3>Tạo nhóm</h3>
            <label for="group-name">Tên nhóm</label>
            <input id="group-name" name="name" maxlength="100" required>
            <label>Thành viên</label>
            <div id="group-users" class="group-users"></div>
            <button id="create-group-button" type="submit">Tạo nhóm</button>
            <button id="recover-group-button" class="secondary" type="button" hidden>Đối chiếu nhóm đã tạo</button>
          </form>
        </section>
      </aside>

      <section class="card chat">
        <div class="chat-heading">
          <div>
            <span>Cuộc trò chuyện</span>
            <h2 id="peer-name">Chọn cuộc trò chuyện</h2>
            <p id="thread-status"></p>
          </div>
          <button id="members-button" class="secondary" type="button" hidden>Thành viên</button>
        </div>

        <section id="members-panel" hidden>
          <ul id="member-list"></ul>
          <form id="add-member-form" hidden>
            <label for="add-member-user">Thêm thành viên</label>
            <div class="row">
              <select id="add-member-user" name="user_id"></select>
              <button id="add-member-button" type="submit">Thêm</button>
            </div>
          </form>
          <button id="leave-button" class="secondary" type="button">Rời nhóm</button>
        </section>

        <div class="history-actions">
          <button id="load-older-button" class="secondary" type="button" hidden>Tin cũ hơn</button>
        </div>

        <div id="history" class="history" aria-live="polite">
          <p class="empty">Chọn một tài khoản để bắt đầu chat.</p>
        </div>

        <form id="message-form" class="message-form">
          <label for="content">Tin nhắn</label>
          <div class="row">
            <input id="content" name="content" autocomplete="off" maxlength="1000" required disabled>
            <button id="send-button" type="submit" disabled>Gửi</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="/realtime-core.js?v=20261001-group" defer></script>
  <script src="/app.js?v=20261001-group" defer></script>
</body>
</html>
